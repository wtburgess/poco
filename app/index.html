<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Poco · Slow & steady life tracker</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#546346">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poco">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
try {
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "on-secondary-fixed": "#1b1c15",
          "on-tertiary-fixed": "#2f140f",
          "inverse-on-surface": "#ffede2",
          "on-secondary-container": "#65655c",
          "primary": "#546346",
          "on-tertiary-fixed-variant": "#613e38",
          "surface-variant": "#fbddc7",
          "primary-fixed-dim": "#bccca8",
          "on-primary-container": "#2f3d23",
          "on-tertiary": "#ffffff",
          "surface-bright": "#fff8f5",
          "background": "#fff8f5",
          "tertiary-fixed": "#ffdad4",
          "surface-container": "#ffeadc",
          "on-secondary-fixed-variant": "#47473f",
          "surface-container-lowest": "#ffffff",
          "surface": "#fff8f5",
          "outline-variant": "#c5c8bc",
          "on-primary-fixed": "#131f08",
          "on-error-container": "#93000a",
          "on-surface": "#28180b",
          "on-surface-variant": "#45483f",
          "surface-container-highest": "#fbddc7",
          "surface-tint": "#546346",
          "primary-fixed": "#d7e8c3",
          "secondary-container": "#e5e3d7",
          "on-error": "#ffffff",
          "secondary-fixed-dim": "#c8c7bc",
          "tertiary-fixed-dim": "#edbbb2",
          "on-background": "#28180b",
          "primary-container": "#98a886",
          "inverse-surface": "#3f2d1e",
          "on-tertiary-container": "#52302b",
          "error": "#ba1a1a",
          "surface-dim": "#f2d4bf",
          "tertiary-container": "#c79890",
          "on-primary": "#ffffff",
          "tertiary": "#7c554e",
          "secondary-fixed": "#e5e3d7",
          "on-secondary": "#ffffff",
          "secondary": "#5f5f56",
          "on-primary-fixed-variant": "#3d4b30",
          "surface-container-high": "#ffe3cf",
          "outline": "#75786f",
          "surface-container-low": "#fff1e9",
          "inverse-primary": "#bccca8",
          "error-container": "#ffdad6"
        },
        borderRadius: { DEFAULT: "1rem", lg: "2rem", xl: "3rem", full: "9999px" },
        spacing: { "border-width": "2.5px", "gutter": "16px", "container-padding": "24px", "unit": "8px" },
        fontFamily: {
          "display-sm": ["Nunito Sans"], "body-md": ["Nunito Sans"], "headline-md": ["Nunito Sans"],
          "display-lg-mobile": ["Nunito Sans"], "label-bold": ["Nunito Sans"], "body-lg": ["Nunito Sans"],
          "display-lg": ["Nunito Sans"]
        },
        fontSize: {
          "display-sm": ["32px", { lineHeight: "38px", letterSpacing: "-0.02em", fontWeight: "900" }],
          "body-md": ["16px", { lineHeight: "26px", fontWeight: "400" }],
          "headline-md": ["24px", { lineHeight: "30px", letterSpacing: "-0.01em", fontWeight: "900" }],
          "display-lg-mobile": ["36px", { lineHeight: "40px", letterSpacing: "-0.03em", fontWeight: "900" }],
          "label-bold": ["14px", { lineHeight: "20px", letterSpacing: "0.02em", fontWeight: "800" }],
          "body-lg": ["18px", { lineHeight: "28px", fontWeight: "500" }],
          "display-lg": ["48px", { lineHeight: "52px", letterSpacing: "-0.03em", fontWeight: "900" }]
        }
      }
    }
  };
} catch (_e) {}

<link rel="stylesheet" href="src/styles.css">
</head>
<body class="bg-background text-on-surface min-h-screen">
  <div id="app"></div>
  <div id="toast-root"></div>
  <div id="modal-root"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
