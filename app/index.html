<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Poco · Slow & steady life tracker</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3c6626">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poco">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800;900&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
try {
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "on-secondary-fixed": "#28180b",
          "on-tertiary-fixed": "#2c1600",
          "inverse-on-surface": "#def4ff",
          "on-secondary-container": "#755e4d",
          "primary": "#3c6626",
          "on-tertiary-fixed-variant": "#683c00",
          "surface-variant": "#c1e9fa",
          "primary-fixed-dim": "#a3d487",
          "on-primary-container": "#f8ffee",
          "on-tertiary": "#ffffff",
          "surface-bright": "#f3faff",
          "background": "#f3faff",
          "tertiary-fixed": "#ffdcbd",
          "surface-container": "#d7f2ff",
          "on-secondary-fixed-variant": "#574333",
          "surface-container-lowest": "#ffffff",
          "surface": "#f3faff",
          "outline-variant": "#c2c9b9",
          "on-primary-fixed": "#072100",
          "on-error-container": "#93000a",
          "on-surface": "#001f29",
          "on-surface-variant": "#42493d",
          "surface-container-highest": "#c1e9fa",
          "surface-tint": "#3e6928",
          "primary-fixed": "#bef1a0",
          "secondary-container": "#f8dac5",
          "on-error": "#ffffff",
          "secondary-fixed-dim": "#dec1ac",
          "tertiary-fixed-dim": "#ffb86d",
          "on-background": "#001f29",
          "primary-container": "#54803c",
          "inverse-surface": "#083542",
          "on-tertiary-container": "#fffbff",
          "error": "#ba1a1a",
          "surface-dim": "#b9e0f1",
          "tertiary-container": "#a96400",
          "on-primary": "#ffffff",
          "tertiary": "#864f00",
          "secondary-fixed": "#fbddc7",
          "on-secondary": "#ffffff",
          "secondary": "#705a49",
          "on-primary-fixed-variant": "#275012",
          "surface-container-high": "#c8eeff",
          "outline": "#73796c",
          "surface-container-low": "#e5f6ff",
          "inverse-primary": "#a3d487",
          "error-container": "#ffdad6"
        },
        borderRadius: { DEFAULT: "1rem", lg: "2rem", xl: "3rem", full: "9999px" },
        spacing: { "border-width": "2.5px", "gutter": "16px", "container-padding": "24px", "unit": "8px" },
        fontFamily: {
          "display-sm": ["Nunito Sans"], "body-md": ["Work Sans"], "headline-md": ["Nunito Sans"],
          "display-lg-mobile": ["Nunito Sans"], "label-bold": ["Work Sans"], "body-lg": ["Work Sans"],
          "display-lg": ["Nunito Sans"]
        },
        fontSize: {
          "display-sm": ["32px", { lineHeight: "40px", fontWeight: "800" }],
          "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
          "headline-md": ["24px", { lineHeight: "32px", fontWeight: "800" }],
          "display-lg-mobile": ["36px", { lineHeight: "42px", fontWeight: "900" }],
          "label-bold": ["14px", { lineHeight: "20px", fontWeight: "700" }],
          "body-lg": ["18px", { lineHeight: "28px", fontWeight: "500" }],
          "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "900" }]
        }
      }
    }
  };
} catch (_e) {}
</script>
<link rel="stylesheet" href="src/styles.css">
</head>
<body class="bg-background text-on-surface min-h-screen">
  <div id="app"></div>
  <div id="toast-root"></div>
  <div id="modal-root"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
